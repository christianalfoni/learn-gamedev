<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="A game design document, and the assignments derived from it." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%9B%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<title>The Game — design document &amp; assignments</title>

<style>
  :root {
    --ground: #F1F3F7; --panel: #FFFFFF; --panel-2: #E9ECF2;
    --ink: #14161B; --ink-2: #4C5261; --ink-3: #858C9C;
    --rule: #D8DCE5; --rule-strong: #C2C8D4; --focus: #3B7FBF;
    --shadow: 0 1px 2px rgba(20,22,27,.06), 0 8px 24px -16px rgba(20,22,27,.28);
    --c-godot: #3B7FBF; --c-aseprite: #C24E7D; --c-audacity: #17877C;
    --c-fl: #7452CC; --c-shader: #A96B12; --c-done: #1F7A4D;
    --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0E1116; --panel: #161A21; --panel-2: #1E232C;
      --ink: #E7EAF0; --ink-2: #A3AAB9; --ink-3: #6D7587;
      --rule: #262C36; --rule-strong: #39414F; --focus: #79B4EA;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
      --c-godot: #6FB0E8; --c-aseprite: #E886B4; --c-audacity: #45C4B6;
      --c-fl: #A98CF0; --c-shader: #E0A44E; --c-done: #4CC38A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1116; --panel: #161A21; --panel-2: #1E232C;
    --ink: #E7EAF0; --ink-2: #A3AAB9; --ink-3: #6D7587;
    --rule: #262C36; --rule-strong: #39414F; --focus: #79B4EA;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
    --c-godot: #6FB0E8; --c-aseprite: #E886B4; --c-audacity: #45C4B6;
    --c-fl: #A98CF0; --c-shader: #E0A44E; --c-done: #4CC38A;
  }
  :root[data-theme="light"] {
    --ground: #F1F3F7; --panel: #FFFFFF; --panel-2: #E9ECF2;
    --ink: #14161B; --ink-2: #4C5261; --ink-3: #858C9C;
    --rule: #D8DCE5; --rule-strong: #C2C8D4; --focus: #3B7FBF;
    --shadow: 0 1px 2px rgba(20,22,27,.06), 0 8px 24px -16px rgba(20,22,27,.28);
    --c-godot: #3B7FBF; --c-aseprite: #C24E7D; --c-audacity: #17877C;
    --c-fl: #7452CC; --c-shader: #A96B12; --c-done: #1F7A4D;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.58;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 900px; margin: 0 auto; padding: 44px 22px 96px; display: flex; flex-direction: column; gap: 28px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
  p { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  /* Masthead */
  .masthead { display: flex; flex-direction: column; gap: 12px; }
  .mast-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .masthead h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 5vw, 48px); line-height: 1.03; letter-spacing: -.015em; }
  .standfirst { font-family: var(--serif); font-size: 17px; color: var(--ink-2); max-width: 62ch; }

  /* Stats */
  .stats { display: flex; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); }
  .stat { padding: 13px 18px; display: flex; flex-direction: column; gap: 1px; flex: 1; }
  .stat + .stat { border-left: 1px solid var(--rule); }
  .stat b { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat span { font-size: 11.5px; color: var(--ink-3); }
  @media (max-width: 620px) {
    .stats { flex-wrap: wrap; }
    .stat { flex: 1 1 50%; }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
  }

  /* GDD areas and features */
  .area { display: flex; flex-direction: column; gap: 13px; }
  .area-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 8px; }
  .area-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 400; letter-spacing: -.01em; }
  .area-head .count { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }

  .feature { background: var(--panel); border: 1px solid var(--rule); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 11px; }
  .feature.undescribed { border-style: dashed; background: transparent; }
  .f-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .f-head h3 { font-size: 16px; letter-spacing: -.005em; }
  .f-id { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .chip-state {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
    padding: 2px 7px; border: 1px solid; margin-left: auto; white-space: nowrap;
  }
  .chip-state.todo { color: var(--ink-3); border-color: var(--rule-strong); }
  .chip-state.gap  { color: var(--c-shader); border-color: color-mix(in srgb, var(--c-shader) 45%, transparent); background: color-mix(in srgb, var(--c-shader) 10%, transparent); }
  .chip-state.ok   { color: var(--c-done); border-color: color-mix(in srgb, var(--c-done) 45%, transparent); background: color-mix(in srgb, var(--c-done) 10%, transparent); }

  .prose { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .prose p { max-width: 68ch; }
  .prose em { color: var(--ink-3); }
  .prose ul { margin: 0; padding-left: 19px; display: flex; flex-direction: column; gap: 4px; }
  .prose code { font-family: var(--mono); font-size: 12.3px; background: var(--panel-2); padding: 1px 4px; color: var(--ink); }
  .prose blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--rule-strong); color: var(--ink-3); font-size: 13.5px; background: var(--panel-2); }
  .prose a { color: var(--ink); text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }

  /* Assignments */
  .assigns { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--rule); padding-top: 11px; }
  a.assign {
    display: flex; align-items: center; gap: 11px; text-decoration: none;
    padding: 8px 10px; border: 1px solid var(--rule); background: var(--ground);
    transition: border-color .15s ease, transform .1s ease;
  }
  a.assign:hover { border-color: var(--tint); transform: translateX(2px); }
  .a-mark { flex: none; width: 20px; height: 20px; padding: 1px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; border: 1px solid color-mix(in srgb, var(--tint) 50%, transparent); }
  .a-mark i { background: var(--px); }
  .a-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); flex: none; }
  .a-title { font-size: 13.5px; color: var(--ink); flex: 1; min-width: 0; }
  .a-prog { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .a-open { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--tint); white-space: nowrap; }
  .a-bar { flex: none; width: 46px; height: 3px; background: var(--panel-2); position: relative; }
  .a-bar i { position: absolute; inset: 0 auto 0 0; background: var(--tint); display: block; }
  @media (max-width: 620px) { .a-bar, .a-prog { display: none; } }

  .none { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding: 3px 0; }
  .none b { color: var(--c-shader); font-weight: 400; }

  /* Footer */
  footer { border-top: 1px solid var(--rule); padding-top: 16px; display: flex; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); align-items: center; }
  footer .links { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  footer a { color: var(--ink); text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
  .linkbtn { background: none; border: 0; padding: 2px; font-family: var(--sans); font-size: 12px; color: var(--ink-3); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
  .linkbtn:hover { color: var(--ink); }

  .loading, .failed { font-family: var(--serif); font-size: 16px; color: var(--ink-3); padding: 30px 0; }
  .failed code { font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); padding: 1px 5px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>

<div class="page">

  <header class="masthead">
    <div class="mast-top">
      <span class="eyebrow">Design document · assignments derived from it</span>
      <span class="eyebrow" id="lastSession">—</span>
    </div>
    <h1 id="gameTitle">…</h1>
    <p class="standfirst" id="gamePitch"></p>
  </header>

  <section class="stats" aria-label="Coverage">
    <div class="stat"><b id="statDescribed">0/0</b><span>sections described</span></div>
    <div class="stat"><b id="statAssign">0</b><span>assignments written</span></div>
    <div class="stat"><b id="statSteps">0/0</b><span>steps done</span></div>
  </section>

  <div id="doc"><p class="loading">Reading the design document…</p></div>

  <footer>
    <div class="links">
      <a href="gdd.md">gdd.md</a>
      <a href="setup.html">Tool setup</a>
      <button type="button" class="linkbtn" id="btnExport">Export progress</button>
      <button type="button" class="linkbtn" id="btnImport">Import</button>
      <input type="file" id="fileInput" accept="application/json" hidden />
    </div>
    <span>Progress is stored in this browser only.</span>
  </footer>

</div>

<script>
(() => {
  "use strict";

  const TOOLS = {
    godot:    { name: "Godot 4",   varName: "--c-godot" },
    aseprite: { name: "Aseprite",  varName: "--c-aseprite" },
    audacity: { name: "Audacity",  varName: "--c-audacity" },
    fl:       { name: "FL Studio", varName: "--c-fl" },
    shader:   { name: "Shaders",   varName: "--c-shader" }
  };

  // Assignments. `gdd` lists the design-document section ids each one serves —
  // that is what places it on this page, and what makes a gap visible when a
  // section has none.
  const ASSIGNMENTS = [
    { id: "A1", t: "The good-movement character", time: "45–90 min", tools: ["godot"],
      gdd: ["movement"], guide: "guides/a1-good-movement.html", steps: 8,
      blurb: "Acceleration, friction, a jump derived from height and time, coyote time and input buffering — then a tuning session." },

    { id: "B7", t: "The character that reads", time: "75–100 min", tools: ["aseprite"],
      gdd: ["player-art"], guide: "guides/b7-character-that-reads.html", steps: 8,
      blurb: "One 32×32 character in five passes — silhouette, palette, flats, light, outline — then broken three ways to see what each rule was doing." },

    { id: "B6", t: "The three-state character", time: "90–120 min", tools: ["aseprite", "godot"],
      gdd: ["player-art"], guide: "guides/b6-three-state-character.html", steps: 9,
      blurb: "Idle, walk and jump animations, tagged in Aseprite, imported with Aseprite Wizard, and switched from movement state in code." },

    { id: "B8", t: "A seamless tileset", time: "90–120 min", tools: ["aseprite"],
      gdd: ["environment-art"], guide: "guides/b8-seamless-tileset.html", steps: 8,
      blurb: "A texture that tiles without a seam plus the 13 edge pieces that let it end, drawn in Aseprite's tilemap mode." },

    { id: "G1", t: "A level from a tileset", time: "75–100 min", tools: ["godot"],
      gdd: ["levels"], guide: "guides/g1-level-from-a-tileset.html", steps: 8,
      blurb: "TileMapLayer, collision that lives on the tile, terrain autotiling, layered depth and camera limits." }
  ];

  /* ── Progress state ──────────────────────────────────────── */

  const KEY = "gamedev-sketchbook-v1";
  const blank = () => ({ sketches: {}, steps: {}, updated: null });
  let state = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state = { sketches: p.sketches || p.etudes || {}, steps: p.steps || {}, updated: p.updated || null };
    }
  } catch (e) { state = blank(); }

  const toolVar = t => "var(" + (TOOLS[t] ? TOOLS[t].varName : "--c-godot") + ")";
  const stemOf = g => g.replace(/^.*\//, "").replace(/\.html$/, "");

  function stepsDone(a) {
    try {
      const raw = localStorage.getItem("gamedev-guide-" + stemOf(a.guide) + "-v1");
      return raw ? Math.min(JSON.parse(raw).length, a.steps) : 0;
    } catch (e) { return 0; }
  }

  /* ── Minimal markdown, enough for a design document ──────── */

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function blocks(md) {
    const out = [];
    for (const chunk of md.split(/\n{2,}/)) {
      const t = chunk.trim();
      if (!t) continue;
      if (/^>/.test(t)) {
        out.push("<blockquote>" + inline(t.replace(/^>\s?/gm, "")).replace(/\n/g, "<br />") + "</blockquote>");
      } else if (/^[-*]\s/m.test(t)) {
        const items = t.split("\n").filter(l => /^[-*]\s/.test(l)).map(l => l.replace(/^[-*]\s+/, "").trim()).filter(Boolean);
        if (items.length) out.push("<ul>" + items.map(i => "<li>" + inline(i) + "</li>").join("") + "</ul>");
      } else {
        out.push("<p>" + inline(t).replace(/\n/g, " ") + "</p>");
      }
    }
    return out.join("");
  }

  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function heading(raw) {
    const m = /\{#([a-z0-9-]+)\}\s*$/i.exec(raw);
    const title = raw.replace(/\{#[a-z0-9-]+\}\s*$/i, "").trim();
    return { title, id: m ? m[1] : slug(title) };
  }

  // A section counts as "described" once there is prose that isn't an italic
  // prompt, an instruction block, or an empty bullet.
  function described(body) {
    return body
      .replace(/^>.*$/gm, "")
      .replace(/\*[^*]*\*/g, "")
      .replace(/^[-*]\s*$/gm, "")
      .trim().length > 0;
  }

  function parseGDD(md) {
    const doc = { title: "Untitled Game", intro: "", areas: [] };
    let area = null, feature = null, buf = [];

    const flush = () => {
      const text = buf.join("\n").trim();
      buf = [];
      if (!text) return;
      if (feature) feature.body += (feature.body ? "\n\n" : "") + text;
      else if (area) area.body += (area.body ? "\n\n" : "") + text;
      else doc.intro += (doc.intro ? "\n\n" : "") + text;
    };

    for (const line of md.split("\n")) {
      let m;
      if ((m = /^###\s+(.*)$/.exec(line))) {
        flush();
        if (!area) { area = { title: "", id: "", body: "", features: [] }; doc.areas.push(area); }
        feature = Object.assign(heading(m[1]), { body: "" });
        area.features.push(feature);
      } else if ((m = /^##\s+(.*)$/.exec(line))) {
        flush(); feature = null;
        area = Object.assign(heading(m[1]), { body: "", features: [] });
        doc.areas.push(area);
      } else if ((m = /^#\s+(.*)$/.exec(line))) {
        flush(); doc.title = m[1].trim();
      } else {
        buf.push(line);
      }
    }
    flush();
    return doc;
  }

  /* ── Render ──────────────────────────────────────────────── */

  const docEl = document.getElementById("doc");

  function assignmentRow(a) {
    const el = document.createElement("a");
    el.className = "assign";
    el.href = a.guide;
    el.style.setProperty("--tint", toolVar(a.tools[0]));

    const mark = document.createElement("span");
    mark.className = "a-mark";
    for (let i = 0; i < 4; i++) {
      const c = document.createElement("i");
      c.style.setProperty("--px", toolVar(a.tools[i % a.tools.length]));
      mark.appendChild(c);
    }

    const done = stepsDone(a);
    const reps = (state.sketches[a.id] || {}).reps || 0;

    const id = document.createElement("span"); id.className = "a-id"; id.textContent = a.id;
    const title = document.createElement("span"); title.className = "a-title"; title.textContent = a.t;
    const bar = document.createElement("span"); bar.className = "a-bar";
    const fill = document.createElement("i"); fill.style.width = (a.steps ? (done / a.steps) * 100 : 0) + "%";
    bar.appendChild(fill);
    const prog = document.createElement("span"); prog.className = "a-prog"; prog.textContent = done + "/" + a.steps;
    const open = document.createElement("span"); open.className = "a-open";
    open.textContent = reps > 0 ? "×" + reps + " →" : done === 0 ? "start →" : done >= a.steps ? "finish →" : "continue →";

    el.append(mark, id, title, bar, prog, open);
    el.title = a.blurb;
    return el;
  }

  function render(doc) {
    docEl.innerHTML = "";
    document.getElementById("gameTitle").textContent = doc.title;

    const used = new Set();
    let described_n = 0, total_n = 0;

    doc.areas.forEach(area => {
      const sec = document.createElement("section");
      sec.className = "area";

      const head = document.createElement("div");
      head.className = "area-head";
      head.innerHTML = '<h2>' + esc(area.title) + '</h2>';
      const count = document.createElement("span");
      count.className = "count";
      head.appendChild(count);
      sec.appendChild(head);

      if (area.body.trim()) {
        const intro = document.createElement("div");
        intro.className = "prose";
        intro.innerHTML = blocks(area.body);
        sec.appendChild(intro);
      }

      let areaAssigned = 0;

      area.features.forEach(f => {
        total_n++;
        const isDescribed = described(f.body);
        if (isDescribed) described_n++;

        const mine = ASSIGNMENTS.filter(a => (a.gdd || []).includes(f.id));
        mine.forEach(a => used.add(a.id));
        if (mine.length) areaAssigned++;

        const card = document.createElement("div");
        card.className = "feature" + (isDescribed ? "" : " undescribed");
        card.id = "s-" + f.id;

        const fh = document.createElement("div");
        fh.className = "f-head";
        fh.innerHTML = '<h3>' + esc(f.title) + '</h3><span class="f-id">#' + esc(f.id) + '</span>';
        const chip = document.createElement("span");
        chip.className = "chip-state " + (!isDescribed ? "todo" : mine.length ? "ok" : "gap");
        chip.textContent = !isDescribed ? "not described" : mine.length ? mine.length + " assignment" + (mine.length > 1 ? "s" : "") : "no assignment yet";
        fh.appendChild(chip);
        card.appendChild(fh);

        if (f.body.trim()) {
          const body = document.createElement("div");
          body.className = "prose";
          body.innerHTML = blocks(f.body);
          card.appendChild(body);
        }

        if (mine.length) {
          const wrap = document.createElement("div");
          wrap.className = "assigns";
          mine.forEach(a => wrap.appendChild(assignmentRow(a)));
          card.appendChild(wrap);
        } else if (isDescribed) {
          const none = document.createElement("p");
          none.className = "none";
          none.innerHTML = '<b>Described, but nothing derived from it yet.</b>';
          card.appendChild(none);
        }

        sec.appendChild(card);
      });

      count.textContent = area.features.length
        ? areaAssigned + "/" + area.features.length + " covered"
        : "";
      docEl.appendChild(sec);
    });

    // Anything not pointing at a section still deserves to be reachable.
    const orphans = ASSIGNMENTS.filter(a => !used.has(a.id));
    if (orphans.length) {
      const sec = document.createElement("section");
      sec.className = "area";
      sec.innerHTML = '<div class="area-head"><h2>Not tied to the document</h2>' +
        '<span class="count">' + orphans.length + '</span></div>';
      const card = document.createElement("div");
      card.className = "feature";
      const wrap = document.createElement("div");
      wrap.className = "assigns";
      wrap.style.borderTop = "0";
      wrap.style.paddingTop = "0";
      orphans.forEach(a => wrap.appendChild(assignmentRow(a)));
      card.appendChild(wrap);
      sec.appendChild(card);
      docEl.appendChild(sec);
    }

    // Stats
    const totalSteps = ASSIGNMENTS.reduce((s, a) => s + a.steps, 0);
    const doneSteps = ASSIGNMENTS.reduce((s, a) => s + stepsDone(a), 0);
    document.getElementById("statDescribed").textContent = described_n + "/" + total_n;
    document.getElementById("statAssign").textContent = String(ASSIGNMENTS.length);
    document.getElementById("statSteps").textContent = doneSteps + "/" + totalSteps;

    const pitch = doc.areas.flatMap(a => a.features).find(f => f.id === "pitch");
    const pitchEl = document.getElementById("gamePitch");
    if (pitch && described(pitch.body)) {
      pitchEl.textContent = pitch.body.replace(/\*[^*]*\*/g, "").replace(/\s+/g, " ").trim();
    } else {
      pitchEl.textContent = "No pitch written yet — open gdd.md and describe the game, then ask for assignments.";
    }

    const stamps = ASSIGNMENTS.map(a => (state.sketches[a.id] || {}).last).filter(Boolean).sort();
    const latest = stamps[stamps.length - 1];
    document.getElementById("lastSession").textContent = latest
      ? "Last session · " + new Date(latest).toLocaleDateString(undefined, { day: "numeric", month: "short" })
      : "No sessions logged yet";
  }

  /* ── Load ────────────────────────────────────────────────── */

  fetch("gdd.md", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(md => render(parseGDD(md)))
    .catch(err => {
      docEl.innerHTML = '<p class="failed">Could not read <code>gdd.md</code> (' + esc(String(err.message)) +
        ').<br />This page reads the document over HTTP, so it needs to be served — ' +
        'open it from the published URL rather than as a local file.</p>';
    });

  /* ── Export / import ─────────────────────────────────────── */

  document.getElementById("btnExport").addEventListener("click", () => {
    const bundle = Object.assign({}, state, { guides: {} });
    ASSIGNMENTS.forEach(a => {
      try {
        const raw = localStorage.getItem("gamedev-guide-" + stemOf(a.guide) + "-v1");
        if (raw) bundle.guides[stemOf(a.guide)] = JSON.parse(raw);
      } catch (e) { /* skip */ }
    });
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
    const el = document.createElement("a");
    el.href = URL.createObjectURL(blob);
    el.download = "gamedev-progress.json";
    el.click();
    URL.revokeObjectURL(el.href);
  });

  const fileInput = document.getElementById("fileInput");
  document.getElementById("btnImport").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        state = { sketches: parsed.sketches || parsed.etudes || {}, steps: parsed.steps || {}, updated: parsed.updated || null };
        Object.entries(parsed.guides || {}).forEach(([stem, steps]) => {
          localStorage.setItem("gamedev-guide-" + stem + "-v1", JSON.stringify(steps));
        });
        state.updated = new Date().toISOString();
        localStorage.setItem(KEY, JSON.stringify(state));
        location.reload();
      } catch (e) {
        alert("That file isn't a progress export — expected JSON with a \"sketches\" key.");
      }
    };
    reader.readAsText(f);
    fileInput.value = "";
  });
})();
</script>
</body>
</html>
